[workspace]
resolver = "2"
members = [
    "crates/malagasy-stemmer",
    "crates/malagasy-stemmer-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Fanilo <fanilo@smartrag.dev>"]
license = "Apache-2.0"
repository = "https://github.com/Tanguy1902/malagasy-stemmer"
homepage = "https://github.com/Tanguy1902/malagasy-stemmer"
keywords = ["malagasy", "stemmer", "nlp", "morphology", "madagascar"]
categories = ["text-processing"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
