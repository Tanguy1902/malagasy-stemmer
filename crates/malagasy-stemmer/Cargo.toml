[package]
name = "malagasy-stemmer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/malagasy-stemmer"
keywords = ["malagasy", "stemmer", "nlp", "morphology", "tantivy"]
categories = ["text-processing"]
readme = "../../README.md"
description = "High-performance morphological stemmer and tokenizer for the Malagasy language, powered by FST dictionaries and formal morphological rules"

[features]
default = []
tantivy = ["dep:tantivy"]

[dependencies]
fst = { version = "0.4", features = ["levenshtein"] }
unicode-segmentation = "1.11"
serde = { version = "1.0", features = ["derive"] }
tantivy = { version = "0.22", optional = true, default-features = false }

[build-dependencies]
fst = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tantivy = { version = "0.22", default-features = false }

[[bench]]
name = "stemmer_bench"
harness = false
