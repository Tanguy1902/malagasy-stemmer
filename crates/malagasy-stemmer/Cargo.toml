[package]
name = "malagasy-stemmer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance morphological stemmer and tokenizer for the Malagasy language, powered by FST dictionaries and formal morphological rules"

[dependencies]
fst = { version = "0.4", features = ["levenshtein"] }
unicode-segmentation = "1.11"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
fst = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "stemmer_bench"
harness = false
