site_name: malagasy-stemmer
site_description: High-performance morphological stemmer and tokenizer for the Malagasy language (Teny Malagasy) in Rust & Python.
site_author: Fanilo
site_url: https://tanguy1902.github.io/malagasy-stemmer/
repo_url: https://github.com/Tanguy1902/malagasy-stemmer
repo_name: Tanguy1902/malagasy-stemmer
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  palette:
    # Mode clair
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Passer au mode sombre
    # Mode sombre
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Passer au mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Accueil: index.md
  - Guide de démarrage: getting-started.md
  - Théorie Linguistique: linguistics.md
  - API Python: python-api.md
  - API Rust: rust-api.md
  - Intégration RAG & Moteurs: rag-and-search.md
  - Architecture & Performance: architecture.md
  - Évaluation & Benchmarks: benchmark-results.md
